name: Build Desktop App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build App
        # এখানে আমরা ডাইরেক্ট npx ব্যবহার করছি যাতে লোকাল ইন্সটলেশন ঝামেলা না হয়
        run: npx nativefier@45.0.3 "https://appcreator05.github.io/update/" --name "VDOSkyApp" --platform windows --arch x64 --electron-version 13.6.9

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDOSkyApp-Windows
          path: VDOSkyApp-win32-x64/

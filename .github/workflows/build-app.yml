name: Build Desktop App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build App
        # এখানে আমরা কোনো নির্দিষ্ট ভার্সন ফিক্স করছি না, যাতে এনভায়রনমেন্টের সাথে মেলে
        run: nativefier "https://appcreator05.github.io/update/" --name "VDOSkyApp" --platform windows --arch x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDOSkyApp-Windows
          path: VDOSkyApp-win32-x64/
